name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: helm-diff/go.mod
          cache-dependency-path: helm-diff/go.mod

      - name: Run tests
        run: go -C helm-diff test ./...

      - name: Build helm-diff
        run: go build -C helm-diff -o "$RUNNER_TEMP/helm-diff" .

      - name: Run action with no changes
        id: action
        uses: ./
        with:
          chart: helm-diff/testdata/chart
          values: helm-diff/testdata/values-prod.yaml
          base-ref: ${{ github.sha }}

      - name: Assert action output
        run: test "${{ steps.action.outputs.changed }}" = false

      - name: Change the manifests
        run: |
          echo "env: staging" > helm-diff/testdata/values-prod.yaml

      - name: Run action with changes
        id: action-changed
        uses: ./
        with:
          chart: helm-diff/testdata/chart
          values: helm-diff/testdata/values-prod.yaml
          base-ref: ${{ github.sha }}

      - name: Assert action output with changes
        run: test "${{ steps.action-changed.outputs.changed }}" = true

      - name: Add a large manifest
        run: |
          {
            echo "apiVersion: v1"
            echo "kind: ConfigMap"
            echo "metadata:"
            echo "  name: {{ .Release.Name }}-large"
            echo "data:"
            for i in $(seq 1 1400); do
              printf '  key-%04d: "a value long enough to fill the pull request comment"\n' "$i"
            done
          } > helm-diff/testdata/chart/templates/large.yaml

      - name: Run action with a large diff
        id: action-large
        uses: ./
        with:
          chart: helm-diff/testdata/chart
          values: helm-diff/testdata/values-prod.yaml
          base-ref: ${{ github.sha }}

      - name: Assert action output with a large diff
        run: test "${{ steps.action-large.outputs.changed }}" = true
