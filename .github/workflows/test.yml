name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Diff unchanged chart
        id: unchanged
        uses: ./
        with:
          chart: test/chart
          values: test/values-prod.yaml
          base-ref: ${{ github.sha }}

      - name: Assert no changes
        run: test "${{ steps.unchanged.outputs.changed }}" = false

      - name: Modify chart values
        run: sed -i s/hello/changed/ test/chart/values.yaml

      - name: Diff modified chart
        id: modified
        uses: ./
        with:
          chart: test/chart
          base-ref: ${{ github.sha }}

      - name: Assert changes detected
        run: test "${{ steps.modified.outputs.changed }}" = true

      - name: Create chart missing on base
        run: cp -r test/chart test/new-chart

      - name: Diff new chart
        id: new
        uses: ./
        with:
          chart: test/new-chart
          base-ref: ${{ github.sha }}

      - name: Assert new chart detected
        run: test "${{ steps.new.outputs.changed }}" = true
