name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: helm-diff/go.mod
          cache-dependency-path: helm-diff/go.mod

      - name: Run tests
        run: go -C helm-diff test ./...

      - name: Build helm-diff
        run: go build -C helm-diff -o "$RUNNER_TEMP/helm-diff" .

      - name: Run action
        id: action
        uses: ./
        with:
          chart: helm-diff/testdata/chart
          values: helm-diff/testdata/values-prod.yaml
          base-ref: ${{ github.sha }}

      - name: Assert action output
        run: test "${{ steps.action.outputs.changed }}" = false
