name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: helm-diff/go.mod
          cache-dependency-path: helm-diff/go.mod

      - name: Run tests
        run: go -C helm-diff test ./...

      - name: Build helm-diff
        run: go build -C helm-diff -o "$RUNNER_TEMP/helm-diff" .

      - name: Run action with no changes and no comment
        id: action
        uses: ./
        with:
          charts-dir: helm-diff/testdata
          base-ref: ${{ github.sha }}
          comment: false

      - name: Assert action output
        run: test "${{ steps.action.outputs.changed }}" = false

      - name: Change one of the two charts
        run: |
          echo "env: staging" > helm-diff/testdata/chart/values.yaml

      - name: Run action on the unchanged chart
        id: action-unchanged
        uses: ./
        with:
          charts-dir: helm-diff/testdata/other-chart
          base-ref: ${{ github.sha }}
          comment: false

      - name: Assert action output on the unchanged chart
        run: test "${{ steps.action-unchanged.outputs.changed }}" = false

      - name: Run action with changes
        id: action-changed
        uses: ./
        with:
          charts-dir: helm-diff/testdata
          base-ref: ${{ github.sha }}

      - name: Assert action output with changes
        run: test "${{ steps.action-changed.outputs.changed }}" = true
