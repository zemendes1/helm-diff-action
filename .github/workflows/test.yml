name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4

      - name: Unchanged chart
        id: unchanged
        uses: ./
        with:
          chart: test/chart
          values: test/values-prod.yaml
          base-ref: ${{ github.sha }}
      - run: test "${{ steps.unchanged.outputs.changed }}" = false

      - name: Modified chart
        run: sed -i s/hello/changed/ test/chart/values.yaml
      - id: modified
        uses: ./
        with:
          chart: test/chart
          base-ref: ${{ github.sha }}
      - run: test "${{ steps.modified.outputs.changed }}" = true

      - name: Chart missing on base
        run: cp -r test/chart test/new-chart
      - id: new
        uses: ./
        with:
          chart: test/new-chart
          base-ref: ${{ github.sha }}
      - run: test "${{ steps.new.outputs.changed }}" = true
