name: Helm Diff
description: Show how a chart's rendered manifests change between the base branch and the current branch

inputs:
  chart:
    description: Path to the chart, relative to the repository root
    required: true
  values:
    description: Newline-separated list of values files, relative to the repository root
    required: false
    default: ""
  base-ref:
    description: Branch or commit to compare against
    required: false
    default: ${{ github.base_ref || github.event.repository.default_branch }}
  args:
    description: Extra arguments passed to `helm template`
    required: false
    default: ""

outputs:
  changed:
    description: "`true` if the rendered manifests differ, `false` otherwise"
    value: ${{ steps.diff.outputs.changed }}

runs:
  using: composite
  steps:
    - name: Run helm diff
      id: diff
      shell: bash
      env:
        CHART: ${{ inputs.chart }}
        VALUES: ${{ inputs.values }}
        BASE_REF: ${{ inputs.base-ref }}
        ARGS: ${{ inputs.args }}
      run: bash "$GITHUB_ACTION_PATH/helm-diff.sh"
